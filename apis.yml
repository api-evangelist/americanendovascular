name: American Endovascular
description: 'American Endovascular & Amputation Prevention is a vascular medical
  practice operating outpatient centers across New York City (Brooklyn, Harlem, and
  Queens) that specializes in minimally invasive, same-day endovascular treatment of
  peripheral artery disease (PAD) and related circulatory conditions. Services include
  atherectomy, angioplasty, stent placement, amputation prevention, diagnostic imaging
  (angiogram, ultrasound, CTA, MRA), neuropathy neurostimulation, dialysis access
  management, and venous insufficiency care. Surfaced as a portfolio company of
  Norwest Venture Partners and added to the API Evangelist network; it publishes a
  public website, blog, and privacy policy but exposes no public developer or API
  surface.'
